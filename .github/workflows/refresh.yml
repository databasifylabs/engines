name: refresh

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  BRANCH: refresh/images

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Move pins to the newest patch of each line
        run: images/images.sh refresh | tee changes.md

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- versions.json; then
            echo "Every pin is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add versions.json
          git commit --quiet --message "chore: refresh image pins"
          git push --force origin "$BRANCH"
          {
            echo "Newest patch of every pinned line. CI builds and smoke-tests the branch; merging to \`main\` publishes and moves the tags."
            echo
            cat changes.md
          } > body.md
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = 0 ]; then
            gh pr create --base main --head "$BRANCH" --title "Refresh image pins" --body-file body.md
          else
            gh pr edit "$BRANCH" --body-file body.md
          fi
          gh workflow run images.yml --ref "$BRANCH"
